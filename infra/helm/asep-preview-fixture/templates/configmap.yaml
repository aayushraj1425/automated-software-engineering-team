apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fixture.name" . }}
data:
  default.conf: |
    server {
      listen 8080;
      location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
      }
      location / {
        default_type text/plain;
        return 200 "asep preview fixture\n";
      }
    }
